[workspace]
resolver = "2"
members = [
    "crates/oco-docx",
    "crates/oco-doc",
    "crates/oco-markdown",
    "crates/oco-formats",
    "crates/oco-layout",
    "crates/oco-xlsx",
    "crates/oco-pptx",
    "crates/oco-cli",
    "crates/oco-wasm",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
publish = false
license = "Apache-2.0"
repository = "https://github.com/zhizhiheng/OpencloudOffice"

[workspace.dependencies]
oco-doc = { path = "crates/oco-doc" }
oco-docx = { path = "crates/oco-docx" }
oco-formats = { path = "crates/oco-formats" }
oco-layout = { path = "crates/oco-layout" }
oco-markdown = { path = "crates/oco-markdown" }
oco-pptx = { path = "crates/oco-pptx" }
oco-xlsx = { path = "crates/oco-xlsx" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# For the WebAssembly module: small, and a panic is a trap.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
