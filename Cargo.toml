[workspace]
resolver = "2"
members = ["crates/oco-docx", "crates/oco-layout", "crates/oco-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.dependencies]
oco-docx = { path = "crates/oco-docx" }
oco-layout = { path = "crates/oco-layout" }
owned_ttf_parser = "0.25"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
