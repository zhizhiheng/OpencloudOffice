name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust and fonts
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default 1.88.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea fonts-dejavu-core fonts-dejavu-extra
          tools/fonts/fetch.sh
      - name: Check and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Build native and WASM
        run: |
          cargo build --release -p oco-cli --locked
          tools/web/build.sh
          target/release/oco --version
      - name: Compare native and WASM pages
        run: node tools/web/check.mjs testdata/zh/*.docx testdata/probes/*.docx testdata/release/*.docx
