[package]
name = "oco-docx"
description = "WordprocessingML (.docx) reader: package, styles, theme fonts and formatting resolution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true, optional = true }

[features]
# Lets the model be written out as JSON. The command-line tool turns it on for its reports;
# the core itself needs no third-party code.
serde = ["dep:serde"]
