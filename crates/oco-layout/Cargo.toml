[package]
name = "oco-layout"
description = "Lays out a parsed document into pages of positioned glyphs, and draws them as SVG"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oco-docx.workspace = true
serde = { workspace = true, optional = true }

[features]
# Lets the model be written out as JSON. The command-line tool turns it on for its reports;
# the core itself needs no third-party code.
serde = ["dep:serde", "oco-docx/serde"]
