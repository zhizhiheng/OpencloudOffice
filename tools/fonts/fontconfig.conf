<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font configuration for reference renderings (LibreOffice).

  It makes the open fonts in ./fonts available and maps the proprietary font
  names found in Chinese documents onto them, the same way the layout engine
  does (see crates/oco-layout/src/fonts.rs). With both sides using the same
  substitutes, differences in the output come from layout, not from fonts.

  Use it by pointing FONTCONFIG_FILE at this file's absolute path;
  tools/zh/reference.py does.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">../../fonts</dir>

  <!-- Song (serif) -->
  <alias binding="same"><family>宋体</family><prefer><family>Source Han Serif CN</family></prefer></alias>
  <alias binding="same"><family>SimSun</family><prefer><family>Source Han Serif CN</family></prefer></alias>
  <alias binding="same"><family>新宋体</family><prefer><family>Source Han Serif CN</family></prefer></alias>
  <alias binding="same"><family>NSimSun</family><prefer><family>Source Han Serif CN</family></prefer></alias>
  <alias binding="same"><family>华文中宋</family><prefer><family>Source Han Serif CN</family></prefer></alias>
  <alias binding="same"><family>方正小标宋简体</family><prefer><family>Source Han Serif CN</family></prefer></alias>
  <!-- FangSong has no open counterpart here yet; Song is the nearest in shape -->
  <alias binding="same"><family>仿宋</family><prefer><family>Source Han Serif CN</family></prefer></alias>
  <alias binding="same"><family>FangSong</family><prefer><family>Source Han Serif CN</family></prefer></alias>
  <alias binding="same"><family>仿宋_GB2312</family><prefer><family>Source Han Serif CN</family></prefer></alias>
  <!-- Hei (sans) -->
  <alias binding="same"><family>黑体</family><prefer><family>Source Han Sans CN</family></prefer></alias>
  <alias binding="same"><family>SimHei</family><prefer><family>Source Han Sans CN</family></prefer></alias>
  <alias binding="same"><family>微软雅黑</family><prefer><family>Source Han Sans CN</family></prefer></alias>
  <alias binding="same"><family>Microsoft YaHei</family><prefer><family>Source Han Sans CN</family></prefer></alias>
  <alias binding="same"><family>等线</family><prefer><family>Source Han Sans CN</family></prefer></alias>
  <alias binding="same"><family>DengXian</family><prefer><family>Source Han Sans CN</family></prefer></alias>
  <!-- Kai -->
  <alias binding="same"><family>楷体</family><prefer><family>LXGW WenKai</family></prefer></alias>
  <alias binding="same"><family>KaiTi</family><prefer><family>LXGW WenKai</family></prefer></alias>
  <alias binding="same"><family>楷体_GB2312</family><prefer><family>LXGW WenKai</family></prefer></alias>
  <!-- Latin: metric-compatible replacements -->
  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Courier New</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Cambria</family><prefer><family>Caladea</family></prefer></alias>
</fontconfig>
